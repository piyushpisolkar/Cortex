<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/cortex-logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7F77DD" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Cortex" />
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 400px;
        animation: fadeIn 0.4s ease;
      }
      .login-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .login-mark {
        width: 92px;
        height: 92px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 0 28px rgba(127, 119, 221, 0.34);
      }
      .login-name {
        font-family: "JetBrains Mono", monospace;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: var(--text);
      }
      .login-sub {
        font-size: 13px;
        color: var(--text-hint);
        letter-spacing: 0.04em;
      }
      .login-divider {
        width: 100%;
        border: none;
        border-top: 1px solid var(--border);
      }
      .login-msg {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }
      .google-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        color: #333;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
        width: 100%;
        justify-content: center;
      }
      .google-btn:hover {
        background: #f0f0f0;
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(127, 119, 221, 0.3);
      }
      .google-icon {
        width: 20px;
        height: 20px;
      }
      .login-footer {
        font-size: 11px;
        color: var(--text-hint);
        text-align: center;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <!-- LOGO -->
        <div class="login-logo">
          <img class="login-mark" src="/icons/cortex-logo.svg" alt="Cortex logo" />
          <p class="login-name">CORTEX</p>
          <p class="login-sub">Study Intelligence</p>
        </div>

        <hr class="login-divider" />

        <p class="login-msg">
          Your personal AI study assistant for engineering. Sign in to start
          learning smarter.
        </p>

        <!-- GOOGLE LOGIN BUTTON -->
        <a href="/auth/google" class="google-btn">
          <svg
            class="google-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Continue with Google
        </a>

        <p class="login-footer">
          By signing in you agree to use Cortex responsibly.<br />Your data is
          never sold or shared.
        </p>
      </div>
    </div>
  </body>
</html>
